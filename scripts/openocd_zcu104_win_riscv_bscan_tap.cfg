bindto 0.0.0.0
gdb_port 3333
telnet_port 4444
tcl_port 6666
debug_level 3

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag
adapter speed 1000

source [find target/xilinx_zynqmp.cfg]

target create riscv_bscan_tap riscv -chain-position uscale.tap
targets riscv_bscan_tap
riscv use_bscan_tunnel 5

init
targets
