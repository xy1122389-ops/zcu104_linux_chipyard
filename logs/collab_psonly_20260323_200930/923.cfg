adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
transport select jtag
reset_config none
adapter speed 1000
jtag newtap uscale ps -irlen 12 -ircapture 0x1 -irmask 0x03 -ignore-version         -expected-id 0x04711093 -expected-id 0x04710093 -expected-id 0x04721093 -expected-id 0x04720093         -expected-id 0x04739093 -expected-id 0x04730093 -expected-id 0x04738093 -expected-id 0x04740093         -expected-id 0x04750093 -expected-id 0x04759093 -expected-id 0x04758093
target create riscv_bscan_ps riscv -chain-position uscale.ps
riscv set_bscan_tunnel_ir 0x923
riscv use_bscan_tunnel 5 0
init
shutdown
