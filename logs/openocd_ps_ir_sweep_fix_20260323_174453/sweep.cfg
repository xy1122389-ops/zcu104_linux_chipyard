bindto 127.0.0.1
gdb port disabled
telnet port disabled
tcl port disabled
debug_level 1
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag
adapter speed 1000
source [find target/xilinx_zynqmp.cfg]
init
foreach ir {0x8c0 0x902 0x903 0x922 0x923 0x924 0x925 0x926 0x927} {
  irscan uscale.ps $ir
  set drpkt [drscan uscale.ps 1 0 7 0x05 5 0x10 3 0]
  echo "IR=$ir IRPKT=$drpkt"
  irscan uscale.ps $ir
  set drpkt2 [drscan uscale.ps 1 1 7 0x20 33 0x0 3 0]
  echo "IR=$ir DRPKT=$drpkt2"
}
shutdown
