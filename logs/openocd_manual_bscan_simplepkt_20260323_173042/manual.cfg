bindto 127.0.0.1
gdb_port disabled
telnet_port disabled
tcl_port disabled
debug_level 3
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag
adapter speed 1000
source [find target/xilinx_zynqmp.cfg]
init
irscan uscale.ps 0x824
set irpkt [drscan uscale.ps 3 0 5 0x10 7 0x05 1 0]
echo IRPKT=$irpkt
irscan uscale.ps 0x824
set drpkt [drscan uscale.ps 3 0 33 0x0 7 0x20 1 1]
echo DRPKT=$drpkt
shutdown
