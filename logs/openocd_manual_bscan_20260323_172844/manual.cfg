bindto 127.0.0.1
gdb_port disabled
telnet_port disabled
tcl_port disabled
debug_level 3
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag
adapter speed 1000
source [find target/xilinx_zynqmp.cfg]
init
set x [drscan uscale.ps 32 0x00000003]
echo DR0=$x
irscan uscale.ps 0x824
set y [drscan uscale.ps 1 0]
echo DR1=$y
shutdown
