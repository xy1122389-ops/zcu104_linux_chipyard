adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
transport select jtag
reset_config none
adapter speed 1000
source [find target/xilinx_zynqmp.cfg]
init
irscan uscale.ps 0x926
set irpkt [drscan uscale.ps 1 0 7 0x05 5 0x10 3 0]
echo IRPKT=$irpkt
irscan uscale.ps 0x926
set drpkt [drscan uscale.ps 1 1 7 0x20 33 0x0 3 0]
echo DRPKT=$drpkt
shutdown
