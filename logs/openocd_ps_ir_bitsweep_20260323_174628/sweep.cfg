bindto 127.0.0.1
gdb port disabled
telnet port disabled
tcl port disabled
debug_level 0
adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
adapter serial 07198
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none
transport select jtag
adapter speed 1000
source [find target/xilinx_zynqmp.cfg]
init
proc probe {ir iw di dw mode} {
  irscan uscale.ps $ir
  if {$mode == 0} {
    set irpkt [drscan uscale.ps 1 0 7 $iw 5 $di 3 0]
    irscan uscale.ps $ir
    set drpkt [drscan uscale.ps 1 1 7 $dw 33 0x0 3 0]
  } else {
    set irpkt [drscan uscale.ps 3 0 5 $di 7 $iw 1 0]
    irscan uscale.ps $ir
    set drpkt [drscan uscale.ps 3 0 33 0x0 7 $dw 1 1]
  }
  echo "CASE ir=$ir iw=$iw di=$di dw=$dw mode=$mode IRPKT=$irpkt"
  echo "CASE ir=$ir iw=$iw di=$di dw=$dw mode=$mode DRPKT=$drpkt"
}
foreach ir {0x925 0x926} {
  probe $ir 0x05 0x10 0x20 0
  probe $ir 0x05 0x01 0x20 0
  probe $ir 0x50 0x01 0x02 0
  probe $ir 0x50 0x10 0x02 0
  probe $ir 0x05 0x10 0x20 1
  probe $ir 0x05 0x01 0x20 1
  probe $ir 0x50 0x01 0x02 1
  probe $ir 0x50 0x10 0x02 1
}
shutdown
