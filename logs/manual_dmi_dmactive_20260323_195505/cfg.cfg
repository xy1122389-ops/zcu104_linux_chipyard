interface ftdi
ftdi_vid_pid 0x0403 0x6011
ftdi_serial 07198
ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb
transport select jtag
reset_config none
adapter_khz 1000
set _CHIPNAME uscale
jtag newtap $_CHIPNAME tap -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x5ba00477
jtag newtap $_CHIPNAME ps -irlen 12 -ircapture 0x1 -irmask 0x03 -ignore-version \
  -expected-id 0x04711093 -expected-id 0x04710093 -expected-id 0x04721093 -expected-id 0x04720093 \
  -expected-id 0x04739093 -expected-id 0x04730093 -expected-id 0x04738093 -expected-id 0x04740093 \
  -expected-id 0x04750093 -expected-id 0x04759093 -expected-id 0x04758093
set jtag_configured 0
jtag configure $_CHIPNAME.ps -event setup {
  global _CHIPNAME
  global jtag_configured
  if { $jtag_configured == 0 } {
    irscan $_CHIPNAME.ps 0x824
    drscan $_CHIPNAME.ps 32 0x00000003
    runtest 100
    set jtag_configured 1
    jtag arp_init
  }
}
init
# Outer USER candidate 0x926, nested tunnel width 5
irscan uscale.ps 0x926
set sel [drscan uscale.ps 1 0 7 0x05 5 0x11 3 0]
echo SEL=$sel
# write DMCONTROL(0x10) = 1 (dmactive)
irscan uscale.ps 0x926
set w0 [drscan uscale.ps 1 1 7 0x29 42 0x4000000006 3 0]
echo WRITE_DMCONTROL=$w0
# nop to collect write response
irscan uscale.ps 0x926
set n0 [drscan uscale.ps 1 1 7 0x29 42 0x0 3 0]
echo NOP_AFTER_WRITE=$n0
# read DMSTATUS(0x11)
irscan uscale.ps 0x926
set r0 [drscan uscale.ps 1 1 7 0x29 42 0x4400000001 3 0]
echo READ_DMSTATUS=$r0
# nop to collect read response
irscan uscale.ps 0x926
set n1 [drscan uscale.ps 1 1 7 0x29 42 0x0 3 0]
echo NOP_AFTER_READ=$n1
shutdown
